[project]
name = "peeka"
version = "0.1.0"
description = "A Python dynamic debugger inspired by Arthas, using Python 3.14's safe external debugger interface"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
peeka-cli = "peeka.cli:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
