[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peeka"
version = "0.1.19"
description = "A Python dynamic debugger inspired by Arthas, using Python 3.14's safe external debugger interface"
readme = "README.md"
requires-python = ">=3.8.1"
license = {text = "Apache-2.0"}
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
tui = [
    "textual~=6.2.1; python_version<'3.9'",
    "textual>=7.5.0; python_version>='3.9'",
]

[project.scripts]
peeka-cli = "peeka.cli:main"
peeka = "peeka.tui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["peeka*"]

[tool.setuptools.package-data]
peeka = ["tui/styles/*.tcss", "core/_attach.gdb", "core/_attach.lldb"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.15.0",
    "textual~=6.2.1; python_version<'3.9'",
    "textual>=7.5.0; python_version>='3.9'",
    "testcontainers>=4.0.0; python_version>='3.9'",
    "docker>=7.0.0",
]
