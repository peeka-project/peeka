[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peeka"
version = "0.1.2"
description = "A Python dynamic debugger inspired by Arthas, using Python 3.14's safe external debugger interface"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
tui = [
    "textual>=7.5.0",
]

[project.scripts]
peeka-cli = "peeka.cli:main"
peeka = "peeka.tui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["peeka*"]

[tool.setuptools.package-data]
peeka = ["tui/styles/*.tcss"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "textual>=7.5.0",
    "testcontainers>=4.0.0",
    "docker>=7.0.0",
]
