[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (in-process agent/client)
    e2e: End-to-end tests (requires process attachment)
    container: Container-based tests (requires Docker)
    slow: Slow tests (>10s)
    py314: Requires Python 3.14+ (PEP 768)
    gdb: Requires GDB (fallback mechanism)
    gevent: gevent monkey-patched target tests
    tui: TUI tests (requires textual)
    perf: Performance regression tests with soft thresholds
    root_metadata: Regression tests for root metadata propagation in stacked lifecycles

timeout = 60
timeout_method = thread

filterwarnings =
    ignore::DeprecationWarning
