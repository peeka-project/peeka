# Peeka Docker Compose 配置
# 使用方法:
#   构建所有镜像: docker-compose build
#   运行 CLI 测试: docker-compose run --rm cli
#   运行 TUI 测试: docker-compose run --rm tui

version: '3.8'

services:
  # CLI 测试环境
  cli:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cli
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  # TUI 测试环境
  tui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tui
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    environment:
      - TERM=xterm-256color

  # Python 3.14 测试环境 (PEP 768)
  py314:
    build:
      context: ..
      dockerfile: docker/Dockerfile.py314
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  # 完整测试环境
  full:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    environment:
      - TERM=xterm-256color
    volumes:
      - ..:/app:cached
