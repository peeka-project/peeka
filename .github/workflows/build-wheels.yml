name: Build Wheels

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build wheels - ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          which clang || echo "Warning: clang not found"
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install build twine
      
      - name: Build wheels
        run: |
          python -m build --wheel
      
      - name: List wheels
        run: |
          ls -lh dist/
          python -c "import glob; wheels = glob.glob('dist/*.whl'); print(f'Built {len(wheels)} wheel(s)'); [print(f'  {w}') for w in sorted(wheels)]"
      
      - name: Verify wheel contents
        run: |
          pip install -q wheel
          python -c "
          import zipfile
          import glob
          wheels = glob.glob('dist/*.whl')
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as z:
                  files = z.namelist()
                  print(f'{wheel}:')
                  c_ext_files = [f for f in files if '_inject' in f and ('.so' in f or '.dylib' in f)]
                  if c_ext_files:
                      print(f'  ✓ C extension found: {c_ext_files}')
                  else:
                      print('  ✗ WARNING: No C extension found in wheel')
                  print(f'  Total files: {len(files)}')
          "
      
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 30
