name: Build Wheels

# Builds one cp38-abi3 wheel per platform with cibuildwheel (config lives in
# pyproject.toml [tool.cibuildwheel]). Called by publish-pypi.yml on tag push,
# so it no longer triggers on tags itself; runs on PRs touching the build.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - setup.py
      - pyproject.toml
      - MANIFEST.in
      - peeka/core/_inject.c
      - .github/workflows/build-wheels.yml

jobs:
  build:
    name: Wheels - ${{ matrix.os }} (${{ matrix.archs }})
    runs-on: ${{ matrix.os }}
    # NOTE: timeout-minutes does not cover time spent waiting for a runner.
    # Only use GitHub-hosted labels that exist; the old macos-13 label was
    # retired and its jobs queued for 24h until GitHub cancelled the run.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            archs: x86_64
          - os: ubuntu-24.04-arm
            archs: aarch64
          # Apple Silicon runner builds both arches; x86_64 is cross-compiled
          # and tested under Rosetta, so no Intel macOS runner is needed.
          - os: macos-14
            archs: arm64 x86_64

    steps:
      - uses: actions/checkout@v5.1.0

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
        with:
          output-dir: wheelhouse

      - name: Check glibc requirement (Linux)
        if: runner.os == 'Linux'
        run: |
          ls wheelhouse/
          # auditwheel (run by cibuildwheel) tags the wheel with the glibc it
          # needs; anything newer than 2.17 would break old target containers.
          ls wheelhouse/*.whl | grep -qE 'cp38-abi3-manylinux_2_17_' \
            || { echo "::error::expected cp38-abi3 manylinux_2_17 wheel"; exit 1; }

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
