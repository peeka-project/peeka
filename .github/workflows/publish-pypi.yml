name: Publish to PyPI

# Trigger on tag push matching v* pattern (e.g., v0.1.0)
# This workflow publishes to PyPI using Trusted Publishing (OIDC)
on:
  push:
    tags: ['v*']

permissions:
  # id-token: write is REQUIRED for OIDC-based Trusted Publishing
  # contents: write is REQUIRED for creating GitHub Releases
  id-token: write
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-timeout pytest-asyncio ruff
      
      - name: Run unit tests
        run: bash scripts/release_check.sh
  
  wheels:
    name: Build wheels
    needs: test
    # cibuildwheel matrix: manylinux2014/musllinux x86_64+aarch64, macOS arm64+x86_64
    uses: ./.github/workflows/build-wheels.yml

  publish:
    name: Build and Publish to PyPI
    needs: [test, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    # environment: pypi tells GitHub Actions to use the PyPI environment
    # which is configured in repo settings with OIDC trusted publishers
    environment: pypi
    
    permissions:
      # id-token: write is REQUIRED for OIDC authentication
      # Allows this job to request an OIDC token from GitHub
      id-token: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install build tools
        run: pip install --upgrade pip build
      
      - name: Clean dist directory
        run: rm -rf dist/
      
      # Wheels come from build-wheels.yml (cibuildwheel, manylinux2014 = glibc 2.17).
      # Building a wheel here on ubuntu-latest produced manylinux_2_34 for cp312 only.
      - name: Build sdist
        run: python -m build --sdist
      
      - name: Download wheels
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      
      - name: Verify wheel contents
        run: |
          ls -l dist/
          for whl in dist/*.whl; do
            unzip -l "$whl" | grep -q 'peeka/core/_inject' || { echo "::error::$whl lacks _inject"; exit 1; }
            unzip -l "$whl" | grep -c 'peeka/' | xargs test 10 -le || exit 1
          done
          ls dist/*.whl | grep -q 'manylinux_2_17_x86_64' || { echo "::error::no manylinux2014 x86_64 wheel"; exit 1; }
          ls dist/*.whl | grep -q 'macosx_.*_arm64' || { echo "::error::no macOS arm64 wheel"; exit 1; }
      
      - name: Publish to PyPI
        # Uses pypa/gh-action-pypi-publish with Trusted Publishing
        # NO API tokens or secrets needed - authentication via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for release notes generation
      
      - name: Generate release notes from commits
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          # Find previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)
          if [ "$PREV_TAG" = "$TAG" ]; then
            # First release, use all commits
            COMMITS=$(git log --oneline --no-merges "${TAG}")
          else
            COMMITS=$(git log --oneline --no-merges "${PREV_TAG}..${TAG}")
          fi
          
          # Build markdown body from commit messages
          BODY="## Changes\n\n"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # Strip commit hash, keep message
            MSG=$(echo "$line" | sed 's/^[a-f0-9]\+ //')
            # Skip version bump commits
            echo "$MSG" | grep -q '^chore(release):' && continue
            BODY+="- ${MSG}\n"
          done <<< "$COMMITS"
          
          # Write to file to preserve newlines
          echo -e "$BODY" > /tmp/release_notes.md
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.md
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
