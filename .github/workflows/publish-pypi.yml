name: Publish to PyPI

# Trigger on tag push matching v* pattern (e.g., v0.1.0)
# This workflow publishes to PyPI using Trusted Publishing (OIDC)
on:
  push:
    tags: ['v*']

permissions:
  # id-token: write is REQUIRED for OIDC-based Trusted Publishing
  # contents: write is REQUIRED for creating GitHub Releases
  id-token: write
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-timeout pytest-asyncio ruff
      
      - name: Run unit tests
        run: bash scripts/release_check.sh
  
  publish:
    name: Build and Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    
    # environment: pypi tells GitHub Actions to use the PyPI environment
    # which is configured in repo settings with OIDC trusted publishers
    environment: pypi
    
    permissions:
      # id-token: write is REQUIRED for OIDC authentication
      # Allows this job to request an OIDC token from GitHub
      id-token: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install build tools
        run: pip install --upgrade pip build auditwheel
      
      - name: Clean dist directory
        run: rm -rf dist/
      
      - name: Build package
        run: python -m build
      
      - name: Repair wheel to manylinux
        run: |
          WHL=$(ls dist/*.whl 2>/dev/null | head -1)
          if [ -n "$WHL" ]; then
            auditwheel repair "$WHL" --wheel-dir dist/ && rm "$WHL"
          fi
      
      - name: Verify wheel contents
        run: |
          unzip -l dist/*.whl | grep -c 'peeka/' | xargs test 10 -le || exit 1
      
      - name: Publish to PyPI
        # Uses pypa/gh-action-pypi-publish with Trusted Publishing
        # NO API tokens or secrets needed - authentication via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for release notes generation
      
      - name: Generate release notes from commits
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          # Find previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)
          if [ "$PREV_TAG" = "$TAG" ]; then
            # First release, use all commits
            COMMITS=$(git log --oneline --no-merges "${TAG}")
          else
            COMMITS=$(git log --oneline --no-merges "${PREV_TAG}..${TAG}")
          fi
          
          # Build markdown body from commit messages
          BODY="## Changes\n\n"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # Strip commit hash, keep message
            MSG=$(echo "$line" | sed 's/^[a-f0-9]\+ //')
            # Skip version bump commits
            echo "$MSG" | grep -q '^chore(release):' && continue
            BODY+="- ${MSG}\n"
          done <<< "$COMMITS"
          
          # Write to file to preserve newlines
          echo -e "$BODY" > /tmp/release_notes.md
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.md
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
